name: Update Claude Desktop

# Checks Anthropic's latest-release redirect and, when a new version is out,
# bumps version/url/hash in package.nix, verifies the package still builds, and
# opens a pull request.
on:
  schedule:
    # Weekly, Mondays at 07:00 UTC. Adjust or remove as you like.
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

# Only one update run at a time; a newer run supersedes an in-flight one.
concurrency:
  group: update-claude-desktop
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Check for a new release and bump package.nix
        id: bump
        run: ./update.sh

      - name: Verify the package builds
        if: steps.bump.outputs.changed == 'true'
        run: nix build .#claude-desktop -L

      - name: Open pull request
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "claude-desktop: ${{ steps.bump.outputs.old_version }} -> ${{ steps.bump.outputs.new_version }}"
          title: "claude-desktop: ${{ steps.bump.outputs.old_version }} -> ${{ steps.bump.outputs.new_version }}"
          body: |
            Automated update to Claude Desktop **${{ steps.bump.outputs.new_version }}**
            (was `${{ steps.bump.outputs.old_version }}`).

            Resolved from Anthropic's `latest/redirect` endpoint. `nix build .#claude-desktop`
            passed on this runner.
          branch: auto-update/claude-desktop
          delete-branch: true
          add-paths: package.nix
